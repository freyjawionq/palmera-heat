<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmera Heat — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0e1a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #frame { position: relative; width: min(100vw, 160vh); aspect-ratio: 16 / 10; }
  canvas { display: block; width: 100%; height: 100%; background: #1a2340; cursor: crosshair; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="game" width="1280" height="800"></canvas>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
